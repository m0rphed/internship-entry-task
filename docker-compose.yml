version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: tictactoe_postgres
    environment:
      POSTGRES_DB: TicTacToe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tictactoe_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tictactoe_api
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=TicTacToe;Username=postgres;Password=postgres
      - TicTacToe__BoardSize=3
      - TicTacToe__WinCondition=3
      - TicTacToe__RandomMoveChance=0.1
      - TicTacToe__RandomMoveInterval=3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tictactoe_network

volumes:
  postgres_data:

networks:
  tictactoe_network:
    driver: bridge
